# 안드로이드 앱(APK) 자동 빌드
# android-app/ 이 바뀌면 빌드해서 GitHub Releases에 walkie-talkie.apk 로 올림
# 휴대폰 다운로드 주소: https://github.com/qmast1973/walkie-talkie/releases/latest/download/walkie-talkie.apk
name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm ci

      - name: Sync web assets and plugins
        run: npx cap sync android

      # 선택: 저장소 Secrets에 서명 키가 있으면 사용(없으면 기본 키로 서명)
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.WALKIE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/walkie.keystore"
            echo "WALKIE_KEYSTORE=$RUNNER_TEMP/walkie.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        working-directory: android-app/android
        env:
          WALKIE_KEYSTORE_PASSWORD: ${{ secrets.WALKIE_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PversionCode=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/walkie-talkie.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: walkie-talkie-apk
          path: walkie-talkie.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: 안드로이드 앱 v1.0.${{ github.run_number }}
          make_latest: true
          files: walkie-talkie.apk
          body: |
            모두의 무전기 안드로이드 앱입니다.
            휴대폰에서 아래 walkie-talkie.apk 를 눌러 받은 뒤 설치하세요.
            (처음 한 번 '출처를 알 수 없는 앱 설치 허용'이 필요할 수 있어요)
